services:
  - type: web
    name: soc-detection-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.services.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: USE_POSTGRES
        value: "false"
      - key: SQLITE_DB_PATH
        value: "soc_platform.db"
      - key: PYTHON_VERSION
        value: "3.11.0"
